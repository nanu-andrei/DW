services:
  cassandra:
    image: cassandra:5.0
    container_name: nanu-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=AcmeDW
      - CASSANDRA_DC=datacenter1
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 15s
      timeout: 10s
      retries: 10

  backend:
    build: ./backend
    container_name: nanu-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      - CASSANDRA_HOSTS=["cassandra"]
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=acme_dw
      - NASDAQ_API_KEY=${NASDAQ_API_KEY:-}
    volumes:
      - ./scripts/init-cassandra.cql:/app/init-cassandra.cql

  frontend:
    build: ./frontend
    container_name: nanu-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1

  spark:
    image: apache/spark:3.5.0
    container_name: nanu-spark
    restart: unless-stopped
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker:
    image: apache/spark:3.5.0
    container_name: nanu-spark-worker
    restart: unless-stopped
    depends_on:
      - spark
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark:7077

volumes:
  cassandra_data:
